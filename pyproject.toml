[project]
name = "ai-agent-security-multi-step-tool-attacks"
version = "0.1.0"
description = "Reproducibility artifacts for a sandboxed agent-security competition"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]
